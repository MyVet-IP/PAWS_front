<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>MedellinVet - Your Pet's Health Partner</title>
  <meta name="description" content="Connect with the best veterinary professionals in Medellin. Quality care for your beloved pets.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#B9FBC0">
  <link rel="icon" href="./frontend/assets/icons/favicon.svg" type="image/svg+xml">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  
  <!-- Design System CSS -->
  <link rel="stylesheet" href="./frontend/src/styles/variables.css">
  <link rel="stylesheet" href="./frontend/src/styles/layout.css">
  <link rel="stylesheet" href="./frontend/src/styles/components.css">
  
  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
  tailwind.config = {
    darkMode: ['selector', '[data-theme="dark"]'],
    theme: {
      extend: {
        colors: {
          // Brand Colors
          pawsGreen: "#B9FBC0",
          pawsPurple: "#F1C0E8",
          pawsYellow: "#FBF8CC",
          pawsBlue: "#90BDF4",
          pawsPink: "#FFCFD2",
          // Semantic Colors
          primary: "#6A4C93",
          "primary-dark": "#5a3d80",
          // Text Colors
          pawsText: "#1f2937",
          pawsSoftText: "#4b5563",
          pawsMuted: "#9ca3af",
          // Backgrounds
          softpink: "#FFCFD2",
          lightblue: "#90BDF4",
          lavender: "#F1C0E8",
          // Status
          success: "#10b981",
          warning: "#f59e0b",
          error: "#ef4444",
          info: "#3b82f6",
        },
        fontFamily: {
          title: ["Poppins", "system-ui", "sans-serif"],
          body: ["Roboto", "system-ui", "sans-serif"],
        },
        borderRadius: {
          'xl': '16px',
          '2xl': '24px',
          '3xl': '32px',
        },
        boxShadow: {
          'soft': '0 4px 20px rgba(0, 0, 0, 0.08)',
          'card': '0 2px 8px rgba(0, 0, 0, 0.06)',
          'card-hover': '0 8px 24px rgba(0, 0, 0, 0.12)',
        },
        animation: {
          'fade-in': 'fadeIn 0.3s ease-out',
          'slide-up': 'slideUp 0.3s ease-out',
          'slide-in': 'slideIn 0.3s ease-out',
        },
        keyframes: {
          fadeIn: {
            '0%': { opacity: '0' },
            '100%': { opacity: '1' },
          },
          slideUp: {
            '0%': { opacity: '0', transform: 'translateY(20px)' },
            '100%': { opacity: '1', transform: 'translateY(0)' },
          },
          slideIn: {
            '0%': { opacity: '0', transform: 'translateX(100%)' },
            '100%': { opacity: '1', transform: 'translateX(0)' },
          },
        },
      }
    }
  }
  </script>
  
  <!-- Dark Mode Script (runs before render to prevent flash) -->
  <script>
    (function() {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body id="app" class="min-h-screen font-body antialiased">
  <!-- App content will be rendered here -->
  <script type="module" src="./frontend/src/main.js"></script>
</body>

</html>
